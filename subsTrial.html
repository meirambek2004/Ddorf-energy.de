<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style/subsTrial.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <img src="/index-img/icon.svg" alt="Logo" />
        <p>
          <span class="black">Ddorf-</span> <span class="blue">energy.de</span>
        </p>
      </div>
      <nav class="menu">
        <div class="menu-nav">
          <img src="/home-img/header-ico/home.svg" alt="Home" />
          <a href="home.html">Home</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/cast.svg" alt="Forecast" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/history.svg" alt="History" />
          <a href="/history.html">History</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="content">
        <div class="head">
          <img id="subscription-button" src="/newAcc-img/button.svg" alt="" />
          <p>Subscription</p>
        </div>
        <div class="current">
          <div class="subs">
            <p>Current Subscription</p>
            <div class="days" id="subscriptionDays">
              <div class="trial">
                <p>Trial 30 days</p>
                <p class="left">
                  <img src="/premium-img/daysLeft.svg" alt="" />
                  <span class="full-text">28 days has left</span>
                  <span class="short-text">28 days</span>
                </p>
              </div>
              <div class="buy">
                <button id="buyPremiumBtn">
                  <img src="/premium-img/extend.svg" alt="" />Buy Premium
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bottom-nav">
      <div class="bottom-bar">
        <a href="#" data-page="dashboard"
          ><img src="/home-img/dashboard.svg" alt="" /><span>Dashboard</span></a
        >
        <a href="devices.html" data-page="devices"
          ><img src="/home-img/devices.svg" alt="" /><span>Devices</span></a
        >
        <a href="account.html" data-page="settings"
          ><img src="/home-img/settings.svg" alt="" /><span>Settings</span></a
        >
      </div>
    </footer>
  </body>
  <script>
    const pageFromPath = location.pathname;

    document.querySelectorAll(".bottom-bar a").forEach((link) => {
      const page = link.dataset.page;

      if (
        (page === "dashboard" && pageFromPath.includes("dashboard")) ||
        (page === "devices" && pageFromPath.includes("devices")) ||
        (page === "settings" &&
          (pageFromPath.includes("subsPremium") ||
            pageFromPath.includes("subsTrial")))
      ) {
        link.classList.add("active");
      }
    });

    document
      .getElementById("subscription-button")
      .addEventListener("click", function () {
        window.location.href = "account.html";
      });

    const buyPremiumBtn = document.getElementById("buyPremiumBtn");
    const subscriptionDays = document.getElementById("subscriptionDays");

    buyPremiumBtn.addEventListener("click", function () {
      subscriptionDays.style.backgroundColor = "#F8E4D3";
      subscriptionDays.innerHTML = `
        <div class="trial">
          <img src="/premium-img/premium.svg" alt="Premium Icon" />
          <p class="">Premium</p>
          <p class="date">until 2025.11.08</p>
        </div>
        <div class="buy">
          <p class="left">28 days has left</p>
          <button class="extend">
            <img src="/premium-img/extend.svg" alt="" />Extend
          </button>
        </div>
      `;
      const extendBtn = subscriptionDays.querySelector("button.extend");
      extendBtn.addEventListener("click", function () {
        window.location.href = "subsPremium.html";
      });
    });
  </script>
</html>
