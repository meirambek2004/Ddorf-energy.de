<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heat Pump Settings</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style/heatPump.css">
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <img src="/index-img/icon.svg" alt="Logo" />
        <p>
          <span class="black">Ddorf-</span> <span class="blue">energy.de</span>
        </p>
      </div>
      <nav class="menu">
        <div class="menu-nav">
          <img src="/home-img/header-ico/home.svg" alt="Home" />
          <a href="home.html">Home</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/cast.svg" alt="Forecast" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/history.svg" alt="History" />
          <a href="/history.html">History</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="settings-title">⬅ Heat pump Settings</div>

      <div class="content-flex">
        <div class="left-settings">
          <div class="setting-group">
            <h4>Min. temperature</h4>
            <div class="row">
              <span>Hot water tank</span>
              <div class="input-box">
                ✏️ <input type="text" value="19 °C" />
              </div>
            </div>
            <div class="row">
              <span>Buffer tank</span>
              <div class="input-box">
                ✏️ <input type="text" value="16 °C" />
              </div>
            </div>
          </div>

          <div class="setting-group">
            <h4>Max. temperature</h4>
            <div class="row">
              <span>Hot water tank</span>
              <div class="input-box">
                ✏️ <input type="text" value="70 °C" />
              </div>
            </div>
            <div class="row">
              <span>Buffer tank</span>
              <div class="input-box">
                ✏️ <input type="text" value="75 °C" />
              </div>
            </div>
          </div>

          <div class="setting-group">
            <h4>Comfort temperature</h4>
            <div class="row">
              <span>Hot water tank</span>
              <div class="input-box">
                ✏️ <input type="text" value="45 °C" />
              </div>
            </div>
            <div class="row">
              <span>Buffer tank</span>
              <div class="input-box">
                ✏️ <input type="text" value="42 °C" />
              </div>
            </div>
          </div>
        </div>

        <div class="schedule schedule-box">
          <h4>Schedule</h4>
          <div class="schedule-btns">
            <div class="btn add">➕ Add (On)</div>
            <div class="btn remove">➖ Add (Off)</div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bottom-nav">
      <div class="bottom-bar">
        <a href="#" data-page="dashboard"
          ><img src="/home-img/dashboard.svg" alt="" /><span>Dashboard</span></a
        >
        <a href="devices.html" data-page="devices"
          ><img src="/home-img/decice-ico.svg" alt="" /><span>Devices</span></a
        >
        <a href="account.html" data-page="subsTrial"
          ><img src="/home-img/settings.svg" alt="" /><span>Settings</span></a
        >
      </div>
    </footer>
  </body>
</html>
