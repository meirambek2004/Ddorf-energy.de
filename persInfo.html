<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style/persInfo.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <img src="/index-img/icon.svg" alt="Logo" />
        <p>
          <span class="black">Ddorf-</span> <span class="blue">energy.de</span>
        </p>
      </div>
      <nav class="menu">
        <div class="menu-nav">
          <img src="/home-img/header-ico/home.svg" alt="Home" />
          <a href="home.html">Home</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/cast.svg" alt="Forecast" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/history.svg" alt="History" />
          <a href="/history.html">History</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="content">
        <div class="head">
          <img id="change-button" src="/newAcc-img/button.svg" alt="" />
          <p>Edit personal information</p>
        </div>
        <div class="info">
          <div class="name">
            <p>First name</p>
            <input type="text" name="" id="" />
            <img
              src="/newAcc-img/input.svg"
              alt=""
              width="16px"
              class="doght"
            />
          </div>
          <div class="name">
            <p>Surname</p>
            <input type="text" name="" id="" />
            <img
              src="/newAcc-img/input.svg"
              alt=""
              width="16px"
              class="doght"
            />
          </div>
          <div class="coun">
            <div class="country">
              <p>Country</p>
              <div class="custom-select">
                <div class="select-selected" tabindex="0">Select a country</div>
                <div class="select-items">
                  <div data-value="de">Germany</div>
                  <div data-value="us">United States</div>
                  <div data-value="fr">France</div>
                  <div data-value="kz">Kazakhstan</div>
                </div>
              </div>
              <img
                src="/newAcc-img/hand-icon.svg"
                alt=""
                width="16px"
                class="county-doght"
              />
            </div>
            <div class="city">
              <p>City</p>
              <input type="text" />
              <img
                src="/newAcc-img/input.svg"
                alt=""
                width="16px"
                class="county-doght"
              />
            </div>
            <div class="zip">
              <p>Zip code</p>
              <input type="text" name="" id="" />
              <img
                src="/newAcc-img/input.svg"
                alt=""
                width="16px"
                class="county-doght"
              />
            </div>
          </div>
          <div class="name">
            <p>Street</p>
            <input type="text" name="" id="" />
            <img
              src="/newAcc-img/input.svg"
              alt=""
              width="16px"
              class="doght"
            />
          </div>
          <div class="name">
            <p>House nr</p>
            <input type="text" name="" id="" />
            <img
              src="/newAcc-img/input.svg"
              alt=""
              width="16px"
              class="doght"
            />
          </div>
          <div class="upload">
            <button>Update information</button>
          </div>
        </div>
      </div>
    </main>
    <footer class="bottom-nav">
      <div class="bottom-bar">
        <a href="#" data-page="dashboard"
          ><img src="/home-img/dashboard.svg" alt="" /><span>Dashboard</span></a
        >
        <a href="devices.html" data-page="devices"
          ><img src="/home-img/devices.svg" alt="" /><span>Devices</span></a
        >
        <a href="account.html" data-page="subsTrial"
          ><img src="/home-img/settings.svg" alt="" /><span>Settings</span></a
        >
      </div>
    </footer>
    <script>
      // JavaScript для кастомного выпадающего списка
      const customSelect = document.querySelector(".custom-select");
      const selectSelected = customSelect.querySelector(".select-selected");
      const selectItems = customSelect.querySelector(".select-items");

      selectSelected.addEventListener("click", () => {
        selectItems.classList.toggle("show");
      });

      selectSelected.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          selectItems.classList.toggle("show");
        }
      });

      selectItems.querySelectorAll("div").forEach((item) => {
        item.addEventListener("click", () => {
          selectSelected.textContent = item.textContent;
          selectItems.classList.remove("show");
        });
      });

      document.addEventListener("click", (e) => {
        if (!customSelect.contains(e.target)) {
          selectItems.classList.remove("show");
        }
      });

      // Существующий JavaScript для навигации
      const pageFromPath = location.pathname;

      document.querySelectorAll(".bottom-bar a").forEach((link) => {
        const page = link.dataset.page;

        if (
          (page === "dashboard" && pageFromPath.includes("dashboard")) ||
          (page === "devices" && pageFromPath.includes("devices")) ||
          (page === "subsTrial" &&
            (pageFromPath.includes("changPassw") ||
              pageFromPath.includes("subsPremium") ||
              pageFromPath.includes("/subsTrial.html") ||
              pageFromPath.includes("persInfo")))
        ) {
          link.classList.add("active");
        }
      });

      document
        .getElementById("change-button")
        .addEventListener("click", function () {
          window.location.href = "account.html";
        });
    </script>
  </body>
</html>
