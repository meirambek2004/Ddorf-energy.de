<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style/account.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <img src="/index-img/icon.svg" alt="Logo" />
        <p>
          <span class="black">Ddorf-</span> <span class="blue">energy.de</span>
        </p>
      </div>
      <nav class="menu">
        <div class="menu-nav">
          <img src="/home-img/header-ico/home.svg" alt="Home" />
          <a href="home.html">Home</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/cast.svg" alt="Forecast" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/history.svg" alt="History" />
          <a href="/history.html">History</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="content">
        <div class="head">
          <p>Settings</p>
        </div>
        <div class="info">
          <div class="card" id="acc-card">
            <div class="main-info">
              <img
                id="photoOutput"
                src="/premium-img/userpic.svg"
                alt="Your photo"
              />
              <!-- <input type="file" id="photoInput" accept="image/*" /> -->
              <div class="name">
                <p>Anthony Hopkins</p>
                <a href="changEmail.html" class="redect">
                  <span>antony*****@gmail.com</span>
                  <img src="/newAcc-img/input.svg" alt="" />
                </a>
                <div class="logout">
                  <img src="/index-img/login.svg" alt="" />
                  <p>Logout</p>
                </div>
              </div>
            </div>
          </div>
          <div class="card" id="personal-info-card">
            <img src="/account-img/info.svg" alt="" />
            <p>Personal information</p>
          </div>
          <div class="card" id="change-password-card">
            <img src="/account-img/passw.svg" alt="" />
            <p>Change password</p>
          </div>
          <div class="card" id="subscription-manage-card">
            <img src="/account-img/subs.svg" alt="" />
            <p>Subscription manage</p>
          </div>
          <div class="card">
            <img src="/account-img/elec.svg" alt="" />
            <p>Electricity rates</p>
          </div>
          <div class="card">
            <img src="/account-img/advance.svg" alt="" />
            <p>Advanced</p>
          </div>
        </div>
      </div>
    </main>
    <footer class="bottom-nav">
      <div class="bottom-bar">
        <a href="#" data-page="dashboard"
          ><img src="/home-img/dashboard.svg" alt="" /><span>Dashboard</span></a
        >
        <a href="devices.html" data-page="devices"
          ><img src="/home-img/devices.svg" alt="" /><span>Devices</span></a
        >
        <a href="account.html" data-page="subsTrial"
          ><img src="/home-img/settings.svg" alt="" /><span>Settings</span></a
        >
      </div>
    </footer>
  </body>
  <script>
    const pageFromPath = location.pathname;

    document.querySelectorAll(".bottom-bar a").forEach((link) => {
      const page = link.dataset.page;

      if (
        (page === "dashboard" && pageFromPath.includes("dashboard")) ||
        (page === "devices" && pageFromPath.includes("devices")) ||
        (page === "subsTrial" &&
          (pageFromPath.includes("changPassw") ||
            pageFromPath.includes("subsPremium") ||
            pageFromPath.includes("/subsTrial.html") ||
            pageFromPath.includes("persInfo") ||
            pageFromPath.includes("account")))
      ) {
        link.classList.add("active");
      }
    });

    document
      .getElementById("personal-info-card")
      .addEventListener("click", function () {
        window.location.href = "persInfo.html";
      });
    document
      .getElementById("change-password-card")
      .addEventListener("click", function () {
        window.location.href = "changPassw.html";
      });
    document
      .getElementById("subscription-manage-card")
      .addEventListener("click", function () {
        window.location.href = "subsTrial.html";
      });
    document.querySelector(".logout").addEventListener("click", function () {
      window.location.href = "index.html";
    });
  </script>
</html>
