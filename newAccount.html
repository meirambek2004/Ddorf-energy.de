<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Page</title>
    <link rel="stylesheet" href="/style/newAccount.css" />
  </head>
  <body>
    <div class="logo">
      <div class="icon">
        <img src="/index-img/icon.svg" alt="" width="50px" />
        <h1><span class="ddorf">Ddorf-</span>energy.de</h1>
      </div>
    </div>
    <div class="new-account">
      <a href="index.html">
        <img src="/newAcc-img/button.svg" alt="" />
      </a>
      <p>New Account</p>
    </div>

    <div class="register-container">
      <div class="info">
        <p>email</p>
        <input type="email" />
        <img src="/newAcc-img/input.svg" alt="" width="16px" height="16px" />
      </div>
      <div class="info">
        <p>Password</p>
        <input type="password" />
        <img src="/newAcc-img/input.svg" alt="" width="16px" height="16px" />
      </div>
      <div class="info">
        <p>Confirm password</p>
        <input type="password" />
        <img src="/newAcc-img/input.svg" alt="" width="16px" height="16px" />
      </div>
      <button>
        <img src="/newAcc-img/ico.svg" alt="" />
        Send verification code
      </button>
    </div>
  </body>
</html>
