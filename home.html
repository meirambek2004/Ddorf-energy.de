<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home Dashboard</title>
    <link rel="stylesheet" href="/style/home.css" />
  </head>
  <body>
    <div class="header">
      <div class="icon">
        <img src="/index-img/icon.svg" alt="" width="50px" />
        <p><span class="ddorf">Ddorf-</span>energy.de</p>
      </div>
      <div class="widjet">
        <div class="widjet-link active">
          <img src="/home-img/header-ico/home.svg" alt="" />
          <a href="/">Home</a>
        </div>
        <div class="widjet-link">
          <img src="/home-img/header-ico/cast.svg" alt="" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="widjet-link">
          <img src="/home-img/header-ico/history.svg" alt="" />
          <a href="/history.html">History</a>
        </div>
      </div>
    </div>

    <div class="dashboard">
      <div class="device house">
        <img src="/home-img/home.svg" alt="House" />
        <div class="home-pow" id="homePower">395 W</div>
      </div>
      <div class="device grid">
        <img src="/home-img/grid.svg" alt="Grid" />
        <div class="grid-poweer" id="gridPrice">25,46 ct</div>
      </div>
      <div class="device inverter">
        <img src="/home-img/inverter.svg" alt="Inverter" />
        <div class="inter-power" id="inverterPower">
          <span class="power-value">521 W</span>
          <div class="toggle" id="soc-toggle">
            <span class="toggle-state">off</span>
            <div class="slider">
              <div class="thumb"></div>
            </div>
            <span class="toggle-opposite"></span>
          </div>
        </div>
      </div>
      <div class="device solar">
        <img src="/home-img/solar.svg" />
        <div class="solar-pow" id="solarPower">1604 W</div>
      </div>
      <div class="device ac">
        <img src="/home-img/ac.svg" alt="AC" />
        <div class="ac-power" id="acPower">395 W</div>
      </div>
      <div class="device battery">
        <img src="/home-img/battery.svg" alt="Battery" />
        <div class="battery-power" id="batteryPower">1604 W</div>
      </div>
      <div class="device ev">
        <img src="/home-img/ev.svg" alt="EV" />
        <div class="ev-power" id="evPower">1604 W</div>
        <div class="ev-battery" id="evBattery">
          <img src="/home-img/charg.svg" alt="" class="charg" />58%
        </div>
      </div>

      <div class="lines">
        <img src="/home-img/vectors/first.svg" alt="" class="first-vector" />
        <img src="/home-img/vectors/second.svg" alt="" class="second-vector" />
        <img src="/home-img/vectors/third.svg" alt="" class="third-vector" />
        <img src="/home-img/vectors/fourth.svg" alt="" class="fourth-vector" />
        <img src="/home-img/vectors/fifth.svg" alt="" class="fifth-vector" />
        <img src="/home-img/vectors/six.svg" alt="" class="six-vector" />
      </div>
    </div>

    <div class="mobile-lines">
      <img src="/home-img/mobile-img/first.svg" alt="" class="mobile-first" />
      <img src="/home-img/mobile-img/second.svg" alt="" class="mobile-second" />
      <img src="/home-img/mobile-img/third.svg" alt="" class="mobile-third" />
      <img src="/home-img/mobile-img/fourth.svg" alt="" class="mobile-fourth" />
      <img src="/home-img/mobile-img/five.svg" alt="" class="mobile-five" />
      <img src="/home-img/mobile-img/six.svg" alt="" class="mobile-six" />
    </div>

    <div class="bottom-nav">
      <div class="nav-dash">
        <img src="/home-img/dashboard.svg" alt="" />
        <a href="#">Dashboard</a>
      </div>
      <div class="nav-dash">
        <img src="/home-img/devices.svg" alt="" />
        <a href="/devices.html">Devices</a>
      </div>
      <div class="nav-dash">
        <img src="/home-img/settings.svg" alt="" />
        <a href="account.html">Settings</a>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Initialize toggle state
        const toggle = document.getElementById("soc-toggle");
        const toggleState = toggle.querySelector(".toggle-state");
        const powerValue = document.querySelector(
          "#inverterPower .power-value"
        );

        // Load toggle state from localStorage
        let isOn =
          JSON.parse(localStorage.getItem("inverterToggleState")) || false;
        toggleState.textContent = isOn ? "on" : "off";
        toggle.classList.toggle("active", isOn);
        powerValue.style.display = isOn ? "inline" : "none";

        // Toggle event listener
        toggle.addEventListener("click", () => {
          isOn = !isOn;
          toggleState.textContent = isOn ? "on" : "off";
          toggle.classList.toggle("active", isOn);
          powerValue.style.display = isOn ? "inline" : "none";
          localStorage.setItem("inverterToggleState", JSON.stringify(isOn));
          console.log("Inverter toggle state:", isOn);
        });

        // Update battery and smart meter settings
        function updateSettings() {
          const batterySettings = JSON.parse(
            localStorage.getItem("batterySettings")
          );
          console.log("Loaded batterySettings:", batterySettings);

          if (batterySettings) {
            const evPowerElement = document.getElementById("evPower");
            if (evPowerElement && batterySettings.chargingPower) {
              evPowerElement.textContent = `${batterySettings.chargingPower} W`;
            } else if (evPowerElement) {
              evPowerElement.textContent = "0 W";
            }

            const evBatteryElement = document.getElementById("evBattery");
            if (evBatteryElement && batterySettings.minCharge) {
              evBatteryElement.innerHTML = `<img src="/home-img/charg.svg" alt="" class="charg" />${batterySettings.minCharge}%`;
            } else if (evBatteryElement) {
              evBatteryElement.innerHTML = `<img src="/home-img/charg.svg" alt="" class="charg" />0%`;
            }
          } else {
            console.log("No batterySettings found in localStorage");
            const evPowerElement = document.getElementById("evPower");
            if (evPowerElement) evPowerElement.textContent = "0 W";
            const evBatteryElement = document.getElementById("evBattery");
            if (evBatteryElement) {
              evBatteryElement.innerHTML = `<img src="/home-img/charg.svg" alt="" class="charg" />0%`;
            }
          }

          const smartMeterSettings = JSON.parse(
            localStorage.getItem("smartMeterSettings")
          );
          console.log("Loaded smartMeterSettings:", smartMeterSettings);

          if (smartMeterSettings) {
            const solarPowerElement = document.getElementById("solarPower");
            if (solarPowerElement && smartMeterSettings.production) {
              solarPowerElement.textContent = `${smartMeterSettings.production} W`;
            } else if (solarPowerElement) {
              solarPowerElement.textContent = "0 W";
            }
          } else {
            console.log("No smartMeterSettings found in localStorage");
            const solarPowerElement = document.getElementById("solarPower");
            if (solarPowerElement) solarPowerElement.textContent = "0 W";
          }
        }

        updateSettings();

        window.addEventListener("storage", (event) => {
          if (
            event.key === "batterySettings" ||
            event.key === "smartMeterSettings"
          ) {
            console.log(
              `Storage event triggered for ${event.key}:`,
              event.newValue
            );
            updateSettings();
          } else if (event.key === "inverterToggleState") {
            isOn = JSON.parse(event.newValue);
            toggleState.textContent = isOn ? "on" : "off";
            toggle.classList.toggle("active", isOn);
            powerValue.style.display = isOn ? "inline" : "none";
            console.log("Inverter toggle state updated via storage:", isOn);
          }
        });

        const currentPath =
          window.location.pathname.split("/").pop() || "home.html";
        document.querySelectorAll(".nav-dash a").forEach((link) => {
          const href = link.getAttribute("href") || "home.html";
          if (href === currentPath) {
            link.parentElement.classList.add("active");
          }
        });
      });
    </script>
  </body>
</html>
