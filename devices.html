<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Devices Dashboard</title>
    <link rel="stylesheet" href="/style/devices.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <img src="/index-img/icon.svg" alt="Logo" />
        <p>
          <span class="black">Ddorf-</span> <span class="blue">energy.de</span>
        </p>
      </div>
      <nav class="menu">
        <div class="menu-nav">
          <img src="/home-img/header-ico/home.svg" alt="Home" />
          <a href="home.html">Home</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/cast.svg" alt="Forecast" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/history.svg" alt="History" />
          <a href="/history.html">History</a>
        </div>
      </nav>
    </header>

    <main class="content">
      <section class="devices">
        <h2>Devices</h2>
        <div class="devices-grid">
          <div class="device-card">
            <div class="title-row">
              <span>Smart meter</span>
              <span class="status running">running</span>
            </div>
            <p>
              Production:
              <span class="status-row">
                <span></span>
                <strong>1604 W</strong>
              </span>
            </p>
            <p>
              Consumption:
              <span class="status-row">
                <span></span>
                <strong>1604 W</strong>
              </span>
            </p>
            <p>
              Feed-in:
              <span class="status-row">
                <span></span>
                <strong>2 W</strong>
              </span>
            </p>
            <div class="status-row">
              <button class="settings-btn">⚙ Settings</button>
            </div>
          </div>
          <div class="device-card">
            <div class="title-row">
              <span>Battery, SMA</span>
              <div>
                <span class="battery-status">🔋 58%</span>
                <span class="status running">running</span>
              </div>
            </div>
            <p>Charging <span class="status-row">1604 W</span></p>
            <div class="status-row">
              <button class="settings-btn">⚙ Settings</button>
            </div>
          </div>
        </div>
      </section>

      <section class="other-devices">
        <div class="section-header">
          <h3>Other Devices</h3>
          <div class="action-buttons">
            <button class="priority">📊 Prioryty</button>
            <button class="add">➕ Add Device</button>
          </div>
        </div>
        <div class="other-grid">
          <div class="device-card">
            <p>Wallbox <span class="status-row">2000 W</span></p>

            <div class="modes">
              <button class="off">Off</button>
              <button class="on">On</button>
              <button class="surplus">Surplus</button>
              <button class="smart">Smart</button>
            </div>
            <div class="status-row">
              <button class="settings-btn" id="wallbox-settings">
                ⚙ Settings
              </button>
            </div>
          </div>
          <div class="device-card">
            <p>Heat Pump <span class="status-row">300 W</span></p>

            <div class="modes">
              <button class="off">Off</button>
              <button class="schedule">Schedule</button>
              <button class="on">On</button>
              <button class="smart">Smart</button>
            </div>
            <div class="status-row">
              <button class="settings-btn" id="heatpump-settings">
                ⚙ Settings
              </button>
            </div>
          </div>
          <div class="device-card">
            <p>Switch 1 <span class="status-row">200 W</span></p>

            <div class="modes">
              <button class="off">Off</button>
              <button class="schedule">Schedule</button>
              <button class="on">On</button>
              <button class="smart">Smart</button>
            </div>
            <div class="status-row">
              <button class="settings-btn" id="switch1-settings">
                ⚙ Settings
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div class="border-line"></div>
    <footer class="bottom-nav">
      <div class="bottom-bar">
        <a href="#" data-page="dashboard"
          ><img src="/home-img/dashboard.svg" alt="" /><span>Dashboard</span></a
        >
        <a href="devices.html" data-page="devices"
          ><img src="/home-img/devices.svg" alt="" /><span>Devices</span></a
        >
        <a href="account.html" data-page="subsTrial"
          ><img src="/home-img/settings.svg" alt="" /><span>Settings</span></a
        >
      </div>
    </footer>
  </body>
  <script>
    const currentPath = window.location.pathname.split("/").pop();

    document.querySelectorAll(".bottom-bar a").forEach((link) => {
      const linkPath = link.getAttribute("href");
      if (linkPath === currentPath) {
        link.classList.add("active");
      }
    });
    const wallboxSettingsBtn = document.getElementById("wallbox-settings");
    if (wallboxSettingsBtn) {
      wallboxSettingsBtn.addEventListener("click", () => {
        window.location.href = "wallbox.html";
      });
    }
    const heatPumpSettingsBtn = document.getElementById("heatpump-settings");
    if (heatPumpSettingsBtn) {
      heatPumpSettingsBtn.addEventListener("click", () => {
        window.location.href = "heatPump.html";
      });
    }
    const switch1SettingsBtn = document.getElementById("switch1-settings");
    if (switch1SettingsBtn) {
      switch1SettingsBtn.addEventListener("click", () => {
        window.location.href = "switch.html";
      });
    }
  </script>
</html>
