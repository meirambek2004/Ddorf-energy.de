<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home Dashboard</title>
    <link rel="stylesheet" href="/style/home.css" />
  </head>
  <body>
    <div class="header">
      <div class="icon">
        <img src="/index-img/icon.svg" alt="" width="50px" />
        <p><span class="ddorf">Ddorf-</span>energy.de</p>
      </div>
      <div class="widjet">
        <div class="widjet-link">
          <img src="/home-img/header-ico/home.svg" alt="" />
          <a href="">Home</a>
        </div>
        <div class="widjet-link">
          <img src="/home-img/header-ico/cast.svg" alt="" />
          <a href="">Forecast</a>
        </div>
        <div class="widjet-link">
          <img src="/home-img/header-ico/history.svg" alt="" />
          <a href="">History</a>
        </div>
      </div>
    </div>
    <div class="dashboard">
      <div class="device house">
        <img src="/home-img/home.svg" alt="House" />
        <div class="home-pow">395 W</div>
      </div>
      <div class="device grid">
        <img src="/home-img/grid.svg" alt="Grid" />
        <div class="grid-poweer">25,46 ct</div>
      </div>
      <div class="device inverter">
        <img src="/home-img/inverter.svg" alt="Inverter" />
        <div class="inter-power">
          521 W
          <div class="on-of">on <span class="toogle"></span></div>
        </div>
      </div>
      <div class="device solar">
        <img src="/home-img/solar.svg" />
        <div class="solar-pow">1604 W</div>
      </div>
      <div class="device ac">
        <img src="/home-img/ac.svg" alt="AC" />
        <div class="ac-power">395 W</div>
      </div>
      <div class="device battery">
        <img src="/home-img/battery.svg" alt="Battery" />
        <div class="battery-power">1604 W</div>
      </div>
      <div class="device ev">
        <img src="/home-img/ev.svg" alt="EV" />
        <div class="ev-power">1604W</div>
        <div class="ev-battery">
          <img src="/home-img/charg.svg" alt="" class="charg" />58%
        </div>
      </div>
      <div class="lines">
        <img src="/home-img/vectors/first.svg" alt="" class="first-vector" />
        <img src="/home-img/vectors/second.svg" alt="" class="second-vector" />
        <img src="/home-img/vectors/third.svg" alt="" class="third-vector" />
        <img src="/home-img/vectors/fourth.svg" alt="" class="fourth-vector" />
        <img src="/home-img/vectors/fifth.svg" alt="" class="fifth-vector" />
        <img src="/home-img/vectors/six.svg" alt="" class="six-vector" />
      </div>
    </div>
    <div class="mobile-lines">
      <img src="/home-img/mobile-img/first.svg" alt="" class="mobile-first" />
      <img src="/home-img/mobile-img/second.svg" alt="" class="mobile-second" />
      <img src="/home-img/mobile-img/third.svg" alt="" class="mobile-third" />
      <img src="/home-img/mobile-img/fourth.svg" alt="" class="mobile-fourth" />
      <img src="/home-img/mobile-img/five.svg" alt="" class="mobile-five" />
      <img src="/home-img/mobile-img/six.svg" alt="" class="mobile-six" />
    </div>
    <div class="bottom-nav">
      <div class="nav-dash">
        <img src="/home-img/dashboard.svg" alt="" />
        <a href="#">Dashboard</a>
      </div>
      <div class="nav-dash">
        <img src="/home-img/devices.svg" alt="" />
        <a href="#">Analytics</a>
      </div>
      <div class="nav-dash">
        <img src="/home-img/settings.svg" alt="" />
        <a href="#">Settings</a>
      </div>
    </div>
  </body>
</html>
