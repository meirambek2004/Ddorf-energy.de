<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Page</title>
    <link rel="stylesheet" href="/style/newAccount.css" />
  </head>
  <body>
    <div class="logo">
      <div class="icon">
        <img src="/index-img/icon.svg" alt="" width="50px" />
        <h1><span class="ddorf">Ddorf-</span>energy.de</h1>
      </div>
    </div>
    <div class="new-account">
      <a href="index.html">
        <img src="/newAcc-img/button.svg" alt="" id="change-button" />
      </a>
      <p>New Account</p>
    </div>

    <div class="register-container">
      <div class="info">
        <p>email</p>
        <input type="email" />
        <img src="/newAcc-img/input.svg" alt="" width="16px" height="16px" />
      </div>
      <div class="info">
        <p>Password</p>
        <input type="password" />
        <img src="/newAcc-img/input.svg" alt="" width="16px" height="16px" />
      </div>
      <div class="info">
        <p>Confirm password</p>
        <input type="password" />
        <img src="/newAcc-img/input.svg" alt="" width="16px" height="16px" />
      </div>

      <div class="button-container" id="buttonContainer">
        <div class="verify-code-container" id="verifyCodeContainer">
          <input type="text" placeholder="Enter code" id="verifyCodeInput" />
        </div>
        <button id="sendCodeBtn">
          <img src="/newAcc-img/ico.svg" alt="" />
          Send verification code
        </button>
      </div>

      <div class="update-message" id="updateMessage">Information updated</div>
    </div>

    <script>
      const sendCodeBtn = document.getElementById("sendCodeBtn");
      const verifyCodeContainer = document.getElementById(
        "verifyCodeContainer"
      );
      const buttonContainer = document.getElementById("buttonContainer");
      const updateMessage = document.getElementById("updateMessage");

      let isCodeSent = false; // Флаг для отслеживания состояния

      sendCodeBtn.addEventListener("click", () => {
        if (!isCodeSent) {
          // Первое нажатие: отправка кода
          verifyCodeContainer.style.display = "block";
          sendCodeBtn.innerHTML = "Confirm changes";
          sendCodeBtn.classList.add("smaller");
          buttonContainer.classList.add("active");
          isCodeSent = true;
        } else {
          // Второе нажатие: подтверждение кода
          updateMessage.style.display = "block";
          sendCodeBtn.style.display = "none"; // Скрываем кнопку после подтверждения
          verifyCodeContainer.style.display = "none"; // Скрываем поле для ввода кода
        }
      });
    </script>
  </body>
</html>
