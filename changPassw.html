<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style/changePassw.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <img src="/index-img/icon.svg" alt="Logo" />
        <p>
          <span class="black">Ddorf-</span> <span class="blue">energy.de</span>
        </p>
      </div>
      <nav class="menu">
        <div class="menu-nav">
          <img src="/home-img/header-ico/home.svg" alt="Home" />
          <a href="home.html">Home</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/cast.svg" alt="Forecast" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/history.svg" alt="History" />
          <a href="/history.html">History</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="content">
        <div class="head">
          <img id="change-button" src="/newAcc-img/button.svg" alt="" />
          <p>Change password</p>
        </div>
        <div class="current">
          <div class="passw">
            <p>Current password</p>
            <input type="text" name="" id="" />
            <img
              src="/newAcc-img/input.svg"
              alt=""
              width="16px"
              height="16px"
              class="dote"
            />
          </div>
          <div class="new">
            <p>New password</p>
            <input type="text" />
            <img
              src="/newAcc-img/input.svg"
              alt=""
              width="16px"
              height="16px"
              class="dote"
            />
          </div>
          <div class="confirm">
            <p>Confirm new password</p>
            <input type="text" name="" id="" />
            <img
              src="/newAcc-img/input.svg"
              alt=""
              width="16px"
              height="16px"
              class="dote"
            />
          </div>
          <div class="verify">
            <div id="verify-container"></div>
            <button id="send-verify-btn">
              <img src="/newAcc-img/ico.svg" alt="" />Send verification code
            </button>
          </div>
        </div>
      </div>
    </main>
    <footer class="bottom-nav">
      <div class="bottom-bar">
        <a href="#" data-page="dashboard"
          ><img src="/home-img/dashboard.svg" alt="" /><span>Dashboard</span></a
        >
        <a href="devices.html" data-page="devices"
          ><img src="/home-img/devices.svg" alt="" /><span>Devices</span></a
        >
        <a href="account.html" data-page="subsTrial"
          ><img src="/home-img/settings.svg" alt="" /><span>Settings</span></a
        >
      </div>
    </footer>
  </body>
  <script>
    const pageFromPath = location.pathname;

    document.querySelectorAll(".bottom-bar a").forEach((link) => {
      const page = link.dataset.page;

      if (
        (page === "dashboard" && pageFromPath.includes("dashboard")) ||
        (page === "devices" && pageFromPath.includes("devices")) ||
        (page === "subsTrial" &&
          (pageFromPath.includes("changPassw") ||
            pageFromPath.includes("subsPremium") ||
            pageFromPath.includes("/subsTrial.html")))
      ) {
        link.classList.add("active");
      }
    });

    document
      .getElementById("change-button")
      .addEventListener("click", function () {
        window.location.href = "account.html";
      });

    const button = document.getElementById("send-verify-btn");
    const container = document.getElementById("verify-container");

    button.addEventListener("click", function () {
      const existingInput = document.getElementById("verify-input");

      if (!existingInput) {
        // Создаем поле, но сначала без класса "show"
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Enter verify code";
        input.id = "verify-input";
        input.style.width = "90px";
        input.style.height = "40px";
        input.style.border = "2px solid #c7cbd8";
        input.style.borderRadius = "10px";
        input.style.padding = "0 10px";
        input.style.marginRight = "10px";
        input.style.fontSize = "12px";

        container.appendChild(input);

        // Даем браузеру время применить стили, затем добавляем класс show для анимации
        requestAnimationFrame(() => {
          input.classList.add("show");
        });

        button.innerHTML = `Confirm changes`;
        button.style.width = "120px";
        button.style.height = "50px";
      } else {
        const code = existingInput.value.trim();
        if (code !== "") {
          // Анимируем скрытие input и кнопки
          existingInput.classList.remove("show");
          button.style.transition = "opacity 0.4s ease";
          button.style.opacity = "0";

          // После анимации скрываем и показываем сообщение
          setTimeout(() => {
            container.innerHTML = ""; // убираем input
            button.remove(); // убираем кнопку

            const successMsg = document.createElement("p");
            successMsg.textContent = "Information updated";
            successMsg.style.fontSize = "16px";
            successMsg.style.fontWeight = "bold";
            successMsg.style.color = "green";
            successMsg.style.marginTop = "10px";
            successMsg.classList.add("show");
            container.appendChild(successMsg);
          }, 400);
        } else {
          alert("Please enter the verification code.");
        }
      }
    });
  </script>
</html>
