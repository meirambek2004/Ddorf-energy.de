<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Email</title>
    <link rel="stylesheet" href="/style/changeEmail.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <img src="/index-img/icon.svg" alt="Logo" />
        <p>
          <span class="black">Ddorf-</span> <span class="blue">energy.de</span>
        </p>
      </div>
      <nav class="menu">
        <div class="menu-nav">
          <img src="/home-img/header-ico/home.svg" alt="Home" />
          <a href="home.html">Home</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/cast.svg" alt="Forecast" />
          <a href="/forecast.html">Forecast</a>
        </div>
        <div class="menu-nav">
          <img src="/home-img/header-ico/history.svg" alt="History" />
          <a href="/history.html">History</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="content">
        <div class="head">
          <img id="change-button" src="/newAcc-img/button.svg" alt="" />
          <p>Change email</p>
        </div>
        <div class="current">
          <div class="curr email input-group">
            <p>Current email</p>
            <div class="input-wrapper">
              <input type="text" placeholder="" />
              <img
                src="/newAcc-img/input.svg"
                alt=""
                width="16px"
                class="doght"
              />
            </div>
          </div>
          <div class="curr new input-group">
            <p>New email</p>
            <div class="input-wrapper">
              <input type="text" placeholder="" />
              <img
                src="/newAcc-img/input.svg"
                alt=""
                width="16px"
                class="doght"
              />
            </div>
          </div>
          <div class="curr password input-group">
            <p>Current password</p>
            <div class="input-wrapper">
              <input type="text" />
              <img
                src="/newAcc-img/input.svg"
                alt=""
                width="16px"
                class="doght"
              />
            </div>
          </div>
          <div class="curr confirm input-group">
            <p>Confirm new email</p>
            <div class="input-wrapper">
              <input type="text" />
              <img
                src="/newAcc-img/input.svg"
                alt=""
                width="16px"
                class="doght"
              />
            </div>
          </div>
          <div class="verif">
            <div
              class="verify-code-wrapper"
              style="display: flex; align-items: center"
            >
              <div
                class="input-wrapper"
                id="verify-input"
                style="display: none; margin-right: 10px"
              >
                <input
                  type="text"
                  placeholder="enter verify code"
                  class="verification-input"
                />
              </div>
              <button id="send-verify-btn">
                <img src="/newAcc-img/ico.svg" alt="" />Send verification code
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bottom-nav">
      <div class="bottom-bar">
        <a href="#" data-page="dashboard"
          ><img src="/home-img/dashboard.svg" alt="" /><span>Dashboard</span></a
        >
        <a href="devices.html" data-page="devices"
          ><img src="/home-img/devices.svg" alt="" /><span>Devices</span></a
        >
        <a href="account.html" data-page="subsTrial"
          ><img src="/home-img/settings.svg" alt="" /><span>Settings</span></a
        >
      </div>
    </footer>
    <script>
      const pageFromPath = location.pathname;

      document.querySelectorAll(".bottom-bar a").forEach((link) => {
        const page = link.dataset.page;

        if (
          (page === "dashboard" && pageFromPath.includes("dashboard")) ||
          (page === "devices" && pageFromPath.includes("devices")) ||
          (page === "subsTrial" &&
            (pageFromPath.includes("changPassw") ||
              pageFromPath.includes("subsPremium") ||
              pageFromPath.includes("/subsTrial.html") ||
              pageFromPath.includes("persInfo") ||
              pageFromPath.includes("changEmail")))
        ) {
          link.classList.add("active");
        }
      });

      document
        .getElementById("change-button")
        .addEventListener("click", function () {
          window.location.href = "account.html";
        });

      let confirmMode = false;

      document
        .getElementById("send-verify-btn")
        .addEventListener("click", function () {
          const verifyInputWrapper = document.getElementById("verify-input");
          const input = verifyInputWrapper.querySelector("input");

          if (!confirmMode) {
            verifyInputWrapper.style.display = "flex";
            this.innerHTML = "Confirm code"; // Можно и с иконкой: `<img src='/...'/> Confirm code`
            this.classList.add("confirm-mode"); // Добавляем стиль
            confirmMode = true;
          } else {
            const code = input.value;
            console.log("Code confirmed:", code);
            // Здесь обработка подтверждения кода
          }
        });
    </script>
  </body>
</html>
